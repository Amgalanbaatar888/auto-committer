name: Auto Commit

on:
  schedule:
    - cron: "*/5 * * * *"  # 5 минут тутам автоматаар ажиллана (UTC)
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.name "Amgalanbaatar888"
          git config --global user.email "amgaahero.gl@gmail.com"

      - name: Generate Random Motivational Phrase
        id: motd
        run: |
          phrases=("Keep pushing forward!" "You're doing best!" "Code. Commit. Conquer." "Small steps, big impact." "Trust the process." "Stay consistent!")
          echo "phrase=${phrases[$RANDOM % ${#phrases[@]}]}" >> $GITHUB_OUTPUT

      - name: Update README.md with daily log
        run: |
          TIMESTAMP=$(TZ='Asia/Ulaanbaatar' date '+%Y-%m-%d %H:%M:%S %Z')
          echo "- ✅ $TIMESTAMP — ${{ steps.motd.outputs.phrase }}" >> README.md

      - name: Commit Changes
        run: |
          git add README.md
          git commit -m "📝 Auto log at $(date)" || echo "No changes to commit"

      - name: Push Changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:main
