name: Auto Commit

on:
  schedule:
    - cron: "0 0 * * *"  # Every day at 08:00 Mongolian time (00:00 UTC)
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.name "Amgalanbaatar888"
          git config --global user.email "amgaahero.gl@gmail.com"

      - name: Update README.md with timestamp
        run: |
          echo "Last auto update: $(date)" > README.md

      - name: Commit Changes
        run: |
          git add README.md
          git commit -m "📝 Daily update: $(date)" || echo "No changes to commit"

      - name: Push Changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:main
